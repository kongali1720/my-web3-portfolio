<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KONGALI WEB3 TERMINAL</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a0f;
  color: #00ff88;
  font-family: 'Courier New', monospace;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow: hidden;
}

/* Matrix rain background canvas */
#matrixBg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  opacity: 0.06;
}

/* Scanline overlay */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,255,136,0.015) 2px,
    rgba(0,255,136,0.015) 4px
  );
  pointer-events: none;
  z-index: 999;
}

.container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 750px;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 24px;
}

.header h1 {
  font-size: 14px;
  letter-spacing: 8px;
  color: #00ff88;
  text-shadow: 0 0 10px rgba(0,255,136,0.5);
  text-transform: uppercase;
  margin-bottom: 4px;
}

.header .version {
  font-size: 10px;
  color: #00aa55;
  letter-spacing: 4px;
}

.header .line {
  height: 1px;
  background: linear-gradient(90deg, transparent, #00ff88, transparent);
  margin-top: 16px;
  opacity: 0.4;
}

/* Status bar */
.status-bar {
  display: flex;
  justify-content: space-between;
  padding: 8px 16px;
  border: 1px solid rgba(0,255,136,0.15);
  border-bottom: none;
  border-radius: 8px 8px 0 0;
  background: rgba(0,255,136,0.03);
  font-size: 11px;
  color: #00aa55;
}

.status-dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #00ff88;
  margin-right: 6px;
  box-shadow: 0 0 6px #00ff88;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Terminal */
#terminal {
  border: 1px solid rgba(0,255,136,0.2);
  border-radius: 0 0 8px 8px;
  padding: 20px;
  height: 380px;
  overflow-y: auto;
  background: rgba(0,5,2,0.8);
  font-size: 13px;
  line-height: 1.7;
  scrollbar-width: thin;
  scrollbar-color: #00ff88 transparent;
}

#terminal::-webkit-scrollbar {
  width: 4px;
}

#terminal::-webkit-scrollbar-thumb {
  background: #00ff88;
  border-radius: 2px;
}

#terminal::-webkit-scrollbar-track {
  background: transparent;
}

.log-line {
  margin-bottom: 2px;
}

.log-prefix {
  color: #00aa55;
}

.log-success {
  color: #00ff88;
  text-shadow: 0 0 8px rgba(0,255,136,0.3);
}

.log-warning {
  color: #ffaa00;
  text-shadow: 0 0 8px rgba(255,170,0,0.3);
}

.log-error {
  color: #ff4444;
  text-shadow: 0 0 8px rgba(255,68,68,0.3);
}

.log-info {
  color: #44aaff;
  text-shadow: 0 0 8px rgba(68,170,255,0.3);
}

.log-dim {
  color: #336644;
}

/* Bottom panel */
.bottom-panel {
  margin-top: 16px;
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

.btn {
  background: transparent;
  color: #00ff88;
  border: 1px solid rgba(0,255,136,0.3);
  padding: 12px 32px;
  cursor: pointer;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  border-radius: 4px;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(0,255,136,0.1), transparent);
  transition: left 0.5s ease;
}

.btn:hover::before {
  left: 100%;
}

.btn:hover {
  background: rgba(0,255,136,0.1);
  border-color: #00ff88;
  box-shadow: 0 0 20px rgba(0,255,136,0.15), inset 0 0 20px rgba(0,255,136,0.05);
  text-shadow: 0 0 10px rgba(0,255,136,0.5);
}

.btn:active {
  transform: scale(0.97);
}

.btn.connected {
  border-color: #00aa55;
  color: #00aa55;
}

/* Loading spinner */
.loading-dots::after {
  content: '';
  animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
  0% { content: ''; }
  25% { content: '.'; }
  50% { content: '..'; }
  75% { content: '...'; }
  100% { content: ''; }
}

.blink {
  animation: blink 1s step-end infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

/* Glow keyframe for important text */
.glow {
  animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 5px rgba(0,255,136,0.3); }
  to { text-shadow: 0 0 20px rgba(0,255,136,0.6), 0 0 40px rgba(0,255,136,0.2); }
}

/* Wallet info card */
.wallet-card {
  margin-top: 12px;
  padding: 12px 16px;
  border: 1px solid rgba(0,255,136,0.15);
  border-radius: 6px;
  background: rgba(0,255,136,0.03);
  display: none;
}

.wallet-card.active {
  display: block;
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.wallet-label {
  font-size: 10px;
  color: #00aa55;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.wallet-value {
  font-size: 13px;
  color: #00ff88;
  word-break: break-all;
}

/* Responsive */
@media (max-width: 600px) {
  #terminal { height: 300px; padding: 14px; font-size: 12px; }
  .header h1 { font-size: 12px; letter-spacing: 5px; }
  .btn { padding: 10px 20px; font-size: 11px; }
}
</style>
</head>
<body>

<canvas id="matrixBg"></canvas>

<div class="container">
  <div class="header">
    <h1>KONGALI1720 WEB3 TERMINAL</h1>
    <div class="version">v2.0 // BSC + ETH + TOR PROXY</div>
    <div class="line"></div>
  </div>

  <div class="status-bar">
    <div><span class="status-dot" id="statusDot"></span><span id="statusText">OFFLINE</span></div>
    <div id="networkText">NETWORK: --</div>
    <div id="timeText">--:--:--</div>
  </div>

  <div id="terminal"></div>

  <div class="bottom-panel">
    <button class="btn" id="connectBtn" onclick="connectWallet()">CONNECT WALLET</button>
    <button class="btn" id="scanBtn" onclick="scanNetwork()">SCAN NETWORK</button>
    <button class="btn" onclick="clearTerminal()">CLEAR</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<script>
const terminal = document.getElementById("terminal");
const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");
const networkText = document.getElementById("networkText");
const timeText = document.getElementById("timeText");

let connectedAddress = null;
let provider = null;

// Clock
setInterval(() => {
  const now = new Date();
  timeText.textContent = now.toTimeString().split(' ')[0];
}, 1000);

function log(text, type = '') {
  const line = document.createElement('div');
  line.className = 'log-line' + (type ? ' ' + type : '');
  line.innerHTML = text;
  terminal.appendChild(line);
  terminal.scrollTop = terminal.scrollHeight;
}

function clearTerminal() {
  terminal.innerHTML = '';
  log('<span class="log-dim">Terminal cleared.</span>');
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// Matrix rain background
function initMatrix() {
  const canvas = document.getElementById('matrixBg');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const chars = '01'.split('');
  const fontSize = 12;
  const cols = Math.floor(canvas.width / fontSize);
  const drops = Array(cols).fill(1);

  function draw() {
    ctx.fillStyle = 'rgba(10,10,15,0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff88';
    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < drops.length; i++) {
      const text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }

  setInterval(draw, 50);
  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
}

initMatrix();

// Boot sequence
async function bootSequence() {
  const lines = [
    ['<span class="log-prefix">[SYS]</span> Initializing KONGALI1720 Web3 Engine v2.0...', 'log-info'],
    ['<span class="log-prefix">[SYS]</span> Loading cryptographic modules...', 'log-dim'],
    ['<span class="log-prefix">[SYS]</span> Tor SOCKS5 proxy ready (127.0.0.1:9050)', 'log-dim'],
    ['<span class="log-prefix">[SYS]</span> SSL verification bypassed', 'log-dim'],
    ['<span class="log-prefix">[NET]</span> BSC RPC nodes loaded (6 fallback)', 'log-info'],
    ['<span class="log-prefix">[NET]</span> Ethereum RPC nodes loaded (4 fallback)', 'log-info'],
    ['<span class="log-prefix">[DEX]</span> PancakeSwap V2 router detected', 'log-dim'],
    ['<span class="log-prefix">[DEX]</span> SushiSwap router detected', 'log-dim'],
    ['<span class="log-prefix">[SEC]</span> Smart contract scanner ready', 'log-dim'],
    ['<span class="log-prefix">[SYS]</span> All modules loaded successfully.', 'log-success'],
    ['', ''],
    ['<span class="log-prefix">[SYS]</span> Ready<span class="blink">_</span>', 'log-success'],
  ];

  for (const [text, type] of lines) {
    log(text, type);
    await sleep(120);
  }

  setStatus('online', 'STANDBY');
}

function setStatus(state, text) {
  statusText.textContent = text;
  if (state === 'online') {
    statusDot.style.background = '#00ff88';
    statusDot.style.boxShadow = '0 0 6px #00ff88';
  } else if (state === 'loading') {
    statusDot.style.background = '#ffaa00';
    statusDot.style.boxShadow = '0 0 6px #ffaa00';
  } else if (state === 'error') {
    statusDot.style.background = '#ff4444';
    statusDot.style.boxShadow = '0 0 6px #ff4444';
  }
}

// Connect wallet
async function connectWallet() {
  const btn = document.getElementById('connectBtn');
  btn.disabled = true;
  btn.textContent = 'CONNECTING...';
  setStatus('loading', 'CONNECTING');

  if (typeof window.ethereum !== 'undefined') {
    try {
      log('<span class="log-prefix">[WALLET]</span> MetaMask detected. Requesting access...', 'log-info');
      await sleep(300);

      provider = new ethers.providers.Web3Provider(window.ethereum);
      await provider.send('eth_requestAccounts', []);

      const signer = provider.getSigner();
      connectedAddress = await signer.getAddress();

      const shortAddr = connectedAddress.slice(0, 10) + '...' + connectedAddress.slice(-8);
      log('<span class="log-prefix">[WALLET]</span> Connected: <span class="log-success glow">' + shortAddr + '</span>', 'log-success');

      const network = await provider.getNetwork();
      let netName = 'Unknown';
      if (network.chainId === 1) netName = 'Ethereum Mainnet';
      else if (network.chainId === 56) netName = 'BSC Mainnet';
      else if (network.chainId === 97) netName = 'BSC Testnet';
      else if (network.chainId === 137) netName = 'Polygon';
      else if (network.chainId === 5) netName = 'Goerli Testnet';

      networkText.textContent = 'NETWORK: ' + netName;
      log('<span class="log-prefix">[NET]</span> Chain: ' + netName + ' (ID: ' + network.chainId + ')', 'log-info');

      const balance = await provider.getBalance(connectedAddress);
      const eth = ethers.utils.formatEther(balance);

      let symbol = 'ETH';
      if (network.chainId === 56 || network.chainId === 97) symbol = 'BNB';

      log('<span class="log-prefix">[BAL]</span> Balance: <span class="log-success">' + parseFloat(eth).toFixed(4) + ' ' + symbol + '</span>', 'log-success');

      log('<span class="log-prefix">[SYS]</span> Wallet connected. Ready for operations.', 'log-success');

      btn.textContent = 'CONNECTED';
      btn.classList.add('connected');
      setStatus('online', 'CONNECTED');

    } catch (e) {
      log('<span class="log-prefix">[ERR]</span> Connection failed: ' + e.message, 'log-error');
      btn.textContent = 'CONNECT WALLET';
      btn.disabled = false;
      setStatus('error', 'ERROR');
    }
  } else {
    log('<span class="log-prefix">[ERR]</span> MetaMask not detected! Install MetaMask extension.', 'log-error');
    log('<span class="log-prefix">[TIP]</span> Download: https://metamask.io', 'log-warning');
    btn.textContent = 'CONNECT WALLET';
    btn.disabled = false;
    setStatus('error', 'NO WALLET');
  }
}

// Scan network
async function scanNetwork() {
  if (!provider) {
    log('<span class="log-prefix">[ERR]</span> Connect wallet first!', 'log-error');
    return;
  }

  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  setStatus('loading', 'SCANNING');

  log('<span class="log-prefix">[SCAN]</span> Initiating network scan...', 'log-info');

  const rpcs = [
    'https://bsc-dataseed.binance.org',
    'https://bsc-dataseed1.defibit.io',
    'https://eth.llamarpc.com',
    'https://eth.drpc.org'
  ];

  for (const rpc of rpcs) {
    try {
      log('<span class="log-prefix">[SCAN]</span> Pinging ' + rpc.split('/')[2] + '...', 'log-dim');
      const start = Date.now();
      const resp = await fetch(rpc, { method: 'POST', body: JSON.stringify({ jsonrpc: '2.0', method: 'eth_blockNumber', params: [], id: 1 }) });
      const ms = Date.now() - start;
      if (resp.ok) {
        const data = await resp.json();
        const block = parseInt(data.result, 16);
        log('<span class="log-prefix">[OK]</span> ' + rpc.split('/')[2] + ' | Block: ' + block + ' | Latency: ' + ms + 'ms', 'log-success');
      } else {
        log('<span class="log-prefix">[WARN]</span> ' + rpc.split('/')[2] + ' | Status: ' + resp.status, 'log-warning');
      }
    } catch (e) {
      log('<span class="log-prefix">[FAIL]</span> ' + rpc.split('/')[2] + ' | Unreachable', 'log-error');
    }
  }

  log('<span class="log-prefix">[SCAN]</span> Network scan complete.', 'log-success');
  setStatus('online', 'CONNECTED');
  btn.disabled = false;
}

bootSequence();
</script>

</body>
</html>
